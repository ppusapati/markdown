[package]
name = "markdown-workspace"
version = "0.1.0"
description = "A cross-platform Markdown workspace desktop app."
authors = ["Markdown Workspace contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "markdown_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "markdown-workspace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
