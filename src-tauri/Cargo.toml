[package]
name = "markdown-workspace"
version = "0.1.0"
description = "A cross-platform Markdown workspace desktop app."
authors = ["Markdown Workspace contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "markdown_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "markdown-workspace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
name = "markdown-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.22"
tauri = { version = "2", optional = true }
thiserror = "1"
walkdir = "2"

[features]
default = []
tauri-commands = ["dep:tauri"]

[dev-dependencies]
tempfile = "3"
