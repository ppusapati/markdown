[package]
name = "markdown-tauri"
version = "0.1.0"
description = "Local-first Markdown workspace backend"
edition = "2021"

[lib]
name = "markdown_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "1"
